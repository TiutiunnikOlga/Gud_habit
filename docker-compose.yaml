version: '3.8'

services:
  db:
    image: postgres:16.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${NAME}
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${PASSWORD}
    ports:
      - "${PORT}:5432"
    networks:
      - app_network

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Gud_habit:/app
      - static_volume:/static
    networks:
      - app_network
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=Gub_habit.settings
    env_file:
      - .env
    depends_on:
      - db
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 10

  celery:
    build:
      context: .
      dockerfile: docker/celery/Dockerfile
    command: >
      sh -c "python manage.py setup_celery --pool=solo --loglevel=INFO"
    environment:
      - DJANGO_SETTINGS_MODULE=habit.settings
      - CELERY_BROKER_URL=redis:${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=redis:${CELERY_RESULT_BACKEND}
      - PYTHONPATH=/app
    volumes:
      - ./:/app
    working_dir: /app
    networks:
      - app_network
    depends_on:
      - redis


  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
    networks:
      - app_network
    depends_on:
      - django

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
