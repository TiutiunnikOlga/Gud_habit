services:
  db:
    image: postgres:16.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${NAME}
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${PASSWORD}
    ports:
      - "${PORT}:5432"
    healthcheck:
      test: pg_isready -U ${USER} -d ${NAME}
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: pg_isready -U ${USER} -d ${NAME}
      interval: 3s
      timeout: 3s
      retries: 10

  celery:
    build: ./celery
    volumes:
      - ./src:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env

  nginx:
    build: .
    ports:
      - "80:80"
    volumes:
      - .nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
volumes:
  postgres_data:
  static_volume: