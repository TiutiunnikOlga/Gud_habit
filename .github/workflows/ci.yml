name: Django CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop


jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: localhost
      DB_PORT: '5432'

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Flake8
        run: flake8 . --config=.flake8

      - name: Start PostgreSQL
        run: |
          sudo service postgresql start
          sleep 10
      - name: Create DB user and database
        run: |
          USER_EXISTS=$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='${DB_USER}'")
          if [ -z "$USER_EXISTS" ]; then
            echo "Creating user ${DB_USER}..."
            sudo -u postgres psql -v ON_ERROR_STOP=1 -c "
              CREATE USER \"${DB_USER}\" WITH PASSWORD '${DB_PASSWORD}';
            "
          else
            echo "User ${DB_USER} already exists."
          fi
          DB_EXISTS=$(sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'")
            if [ -z "$DB_EXISTS" ]; then
              echo "Creating database ${DB_NAME}..."
              sudo -u postgres psql -v ON_ERROR_STOP=1 -c "
                CREATE DATABASE \"${DB_NAME}\" OWNER \"${DB_USER}\";
              "
            else
              echo "Database ${DB_NAME} already exists."
            fi
            echo "Granting privileges..."
              sudo -u postgres psql -v ON_ERROR_STOP=1 -c "
                GRANT ALL PRIVILEGES ON DATABASE \"${DB_NAME}\" TO \"${DB_USER}\";
              "
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Ensure DB user password
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "
            ALTER USER \"${DB_USER}\" WITH PASSWORD '${DB_PASSWORD}';
          "
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Test DB connection
        run: |
          export PGPASSWORD="${DB_PASSWORD}"
          psql -h localhost -U ${DB_USER} -d ${DB_NAME} -c "SELECT 1;"
        env:
          PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_NAME: ${{ secrets.DB_NAME }}

      - name: Debug Django DB settings
        run: |
          python -c "
          import os
          print('DB_NAME:', os.environ.get('DB_NAME'))
          print('DB_USER:', os.environ.get('DB_USER'))
          print('DB_PASSWORD:', os.environ.get('DB_PASSWORD'))
          print('DB_HOST:', os.environ.get('DB_HOST', '127.0.0.1'))
          print('DB_PORT:', os.environ.get('DB_PORT', '5432'))
          "
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432

      - name: Run migrations
        run: python manage.py migrate
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_HOST: localhost
          DB_PORT: 5432
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

      - name: Run tests
        run: python manage.py test
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_HOST: localhost
          DB_PORT: 5432

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in in Docker hub
        run: echo '${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}' | docker login -u '${{ secrets.DOCKER_HUB_USERNAME }}'  --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image in Docker hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
          docker stop myapp || true
          docker rm myapp || true
          docker run -d --name myapp -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
          EOF